services:
  postgres:
    image: postgres:16-alpine
    container_name: kanso_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: kanso_db
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - kanso_pgdata:/var/lib/postgresql/data

volumes:
  kanso_pgdata:
